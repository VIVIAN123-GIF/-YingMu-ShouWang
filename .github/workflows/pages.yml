name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:pages
      - name: Privacy and public-label scan
        working-directory: .
        run: python scripts/validate_pages_build.py --dist frontend/dist --report output/pages/privacy-report.json
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - uses: actions/upload-artifact@v4
        with:
          name: pages-verification
          path: |
            frontend/artifacts/pages
            output/pages

  deploy:
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-public:
    runs-on: ubuntu-latest
    needs: deploy
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify the deployed public site
        env:
          PAGES_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npm run test:pages
      - name: Write public online-entry verification artifact
        working-directory: .
        run: python scripts/write_online_entry_verification.py --url "${{ needs.deploy.outputs.page_url }}"
      - uses: actions/upload-artifact@v4
        with:
          name: pages-public-verification
          path: |
            frontend/artifacts/pages
            output/pages/online-entry-verification.json
